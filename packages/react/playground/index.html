<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouAsked playground</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f2f2f7; --surface-1:#fff; --surface-2:#f2f2f7; --hairline:#e5e5ea; --text-1:#000; --text-2:#6c6c70; --accent:#5b3df5; }
  .dark { --bg:#000; --surface-1:#1c1c1e; --surface-2:#2c2c2e; --hairline:#2c2c2e; --text-1:#fff; --text-2:#98989f; --accent:#9b87f5; }
  body { margin:0; background:var(--bg); color:var(--text-1); font-family:"Plus Jakarta Sans", system-ui, sans-serif; }
  .app { max-width: 480px; margin: 0 auto; padding: 16px; }
  header { display:flex; justify-content:space-between; align-items:center; padding: 8px 0 16px; font-size: 20px; }
  header button, .menu { font:inherit; font-size:15px; background:var(--surface-1); color:var(--text-1); border:1px solid var(--hairline); border-radius:12px; padding:10px 14px; cursor:pointer; }
  .card { background:var(--surface-1); border-radius:20px; padding:18px; margin-bottom:12px; display:flex; flex-direction:column; gap:8px; }
  .muted { color:var(--text-2); margin:0; } .big { font-size: 34px; font-weight: 800; margin: 0; }
  .menu { text-align:left; display:flex; justify-content:space-between; }
  .badge { background: var(--accent); color:#fff; border-radius: 999px; padding: 0 8px; font-size: 13px; }
</style>
</head>
<body><div id="root"></div><script type="module" src="./bundle.js"></script></body>
</html>
